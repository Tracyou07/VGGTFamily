[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="nrgbd-eval"
version="0.1.0"
requires-python=">=3.10"
dependencies=["numpy>=1.24","Pillow>=9","scipy>=1.10","open3d>=0.18,<1"]
[project.scripts]
nrgbd-eval="nrgbd_eval.cli:main"
[tool.setuptools.packages.find]
where=["src"]
