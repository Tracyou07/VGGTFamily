[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-kitti-eval"
version = "0.1.0"
description = "Virtual KITTI standalone evaluation infrastructure for six VGGT-family models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "torch>=2.4", "safetensors>=0.4"]

[project.scripts]
virtual-kitti-eval = "virtual_kitti_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
